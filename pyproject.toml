[project]
name = "unienv"
description = "Unified robot environment framework supporting multiple tensor and simulation backends"
readme = "README.md"
license = "MIT"
version = "0.0.1b15"
requires-python = ">= 3.10"
dependencies = [
    "numpy",
    "xbarray>=0.0.1a20",
    "pillow",
    "cloudpickle",
    "pyvers",
]

[project.optional-dependencies]
network = [
    "websockets>=15,<16",
]
calibration = [
    # TODO(opencv5): OpenCV 5.0.0 does not expose cv2.calibrateHandEye to Python (declared
    # CV_EXPORTS, not CV_EXPORTS_W). Fixed upstream in opencv/opencv@325e30db1d on 5.x but
    # unreleased as of 2026-10-16; lift the <5 cap (e.g. to !=5.0.0.*) once a 5.x release ships it.
    "opencv-contrib-python>=4.7,<5",
]
dev = [
    "pytest",
    "pytest-timeout",
    "pytest-cov",
    "hypothesis",
    "opencv-contrib-python>=4.7,<5",  # see TODO(opencv5) in the calibration extra
    "websockets>=15,<16",
    "gymnasium>=0.29.0",
    "moviepy>=2.1",
    "torch",
    "jax",
    "pyarrow",
    "h5py",
    "av",
    "datasets",
    "huggingface_hub",
    "typing_extensions",
]
gymnasium = [
    "gymnasium>=0.29.0",
]
video = [
    "moviepy>=2.1",
]

[project.urls]
Homepage = "https://github.com/UniEnvOrg/UniEnv"
Documentation = "https://github.com/UniEnvOrg/UniEnv"
Repository = "https://github.com/UniEnvOrg/UniEnv"
Issues = "https://github.com/UniEnvOrg/UniEnv/issues"
Changelog = "https://github.com/UniEnvOrg/UniEnv/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["training*", "tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests_interface", "tests_data", "tests_utils"]
timeout = 300
markers = [
    "slow: long-running tests (video encoding, multiprocessing); deselect with -m 'not slow'",
    "gpu: tests that need a CUDA device",
]
