<!doctype html>
<meta charset="utf-8">
<title>Page not found</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:40rem;margin:15vh auto;padding:0 1.5rem;color:#15191f}a{color:#1b5e93}</style>
<!-- Root 404.html of a mike-versioned docs site (copied there by the docs workflow).
     Links from before versioning (/<Project>/concepts/...) have no version segment;
     send them to the same page under /latest/. -->
<p id="msg">Looking for this page…</p>
<script>
(async () => {
  const parts = location.pathname.split("/").filter(Boolean);
  const msg = document.getElementById("msg");
  if (parts.length) {
    const base = "/" + parts[0] + "/";
    try {
      const versions = await (await fetch(base + "versions.json", {cache: "no-store"})).json();
      const known = new Set(versions.flatMap(v => [v.version, ...(v.aliases || [])]));
      if (parts.length > 1 && !known.has(parts[1])) {
        location.replace(base + "latest/" + parts.slice(1).join("/") + "/" + location.search + location.hash);
        return;
      }
    } catch (e) { /* not a versioned site */ }
    msg.innerHTML = 'Page not found. Go to the <a href="' + base + '">documentation home</a>.';
    return;
  }
  msg.innerHTML = 'Page not found. Go to <a href="/">unienvorg.github.io</a>.';
})();
</script>
